<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>音乐下载器 · aiLinMc</title>
<meta name="description" content="aiLinMc 音乐下载器 —— 在线搜索、试听并下载歌曲与歌词。数据来源：Hi歌曲网。">
<link rel="stylesheet" href="assets/css/music.css">
</head>
<body>
<header class="topbar">
    <div class="brand">
        <span class="logo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
        <span>音乐下载器</span>
        <small>数据来源：Hi歌曲网</small>
    </div>
    <nav class="page-nav">
        <a class="nav-link active" href="music.html">主页</a>
        <a class="nav-link" href="search.html">搜索</a>
        <a class="nav-link" href="playlists.html">歌单</a>
    </nav>
    <button class="theme-btn" id="themeBtn"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg><span>深色模式</span></button>
</header>

<main class="wrap">
    <section class="search-area">
        <div class="search-box">
            <input id="searchInput" placeholder="输入歌曲名称，如：月亮" autocomplete="off" maxlength="60">
            <button class="search-btn" id="searchBtn">搜索</button>
        </div>
        <div class="history-wrap hidden" id="historyWrap">
            <div class="history-head">
                <span>搜索历史</span>
                <button class="history-clear" id="historyClear" type="button">清空</button>
            </div>
            <div class="history-chips" id="historyChips"></div>
        </div>
        <p class="hint" id="searchHint"></p>
    </section>

    <section class="panel">
        <div class="panel-head">
            <h2>热门歌曲</h2>
            <div class="panel-tools">
                <span class="count" id="resultCount"></span>
                <button class="refresh-btn" id="refreshBtn" type="button" title="重新获取最新内容">
                    <span class="ico"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg></span>刷新
                </button>
            </div>
        </div>
        <div class="result-list" id="hotList">
            <div class="loading-box"><span class="spin"></span>正在获取热门歌曲…</div>
        </div>
    </section>
</main>

<footer class="foot">⚠️ 本工具仅供内部使用，严禁对外传播、转载或用于商业用途 | 歌曲数据来源：Hi歌曲网 · https://higequ.com/</footer>

<div class="toast" id="toast"></div>

<script src="assets/js/music-common.js"></script>
<script>
(function () {
    'use strict';
    var MC = window.MusicCommon;
    MC.initTheme();
    MC.bindHistoryClear();
    // 点击历史词 → 记入历史并跳转搜索页
    MC.renderHistory(function (k) {
        MC.addHistory(k);
        location.href = 'search.html?keyword=' + encodeURIComponent(k);
    });

    var searchInput = MC.$('searchInput');
    var searchBtn = MC.$('searchBtn');
    var searchHint = MC.$('searchHint');
    var hotList = MC.$('hotList');
    var resultCount = MC.$('resultCount');
    var refreshBtn = MC.$('refreshBtn');

    function goSearch() {
        var k = searchInput.value.trim();
        if (!k) { MC.toast('请输入歌曲名称', true); return; }
        MC.addHistory(k);
        location.href = 'search.html?keyword=' + encodeURIComponent(k);
    }
    searchBtn.addEventListener('click', goSearch);
    searchInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') goSearch(); });

    function renderHot(results) {
        resultCount.textContent = results.length ? '共 ' + results.length + ' 首' : '';
        if (!results.length) {
            hotList.innerHTML = '<div class="empty-box">暂无热门歌曲</div>';
            return;
        }
        var frag = document.createDocumentFragment();
        results.forEach(function (r, i) {
            var item = document.createElement('div');
            item.className = 'result-item';
            item.innerHTML =
                '<span class="num">' + (i + 1) + '</span>' +
                '<div class="meta"><div class="title"></div><div class="artist"></div></div>' +
                '<span class="go">' + MC.icons.chevron + '</span>';
            item.querySelector('.title').textContent = r.title;
            item.querySelector('.artist').textContent = r.artist;
            item.addEventListener('click', function () {
                location.href = 'player.html?id=' + encodeURIComponent(r.id);
            });
            frag.appendChild(item);
        });
        hotList.innerHTML = '';
        hotList.appendChild(frag);
    }

    var hotLoading = false;
    function loadHot(force) {
        if (hotLoading) return;
        hotLoading = true;
        refreshBtn.disabled = true;
        refreshBtn.classList.add('loading');
        searchHint.textContent = '正在获取热门歌曲…';
        fetch('/api/music/hot')
            .then(function (res) {
                return res.json().then(function (d) { return { d: d, res: res }; });
            })
            .then(function (o) {
                if (!o.res.ok) throw MC.respError(o.d, o.res);
                renderHot(o.d.results);
                searchHint.textContent = o.d.results.length
                    ? '热门歌曲 ' + o.d.results.length + ' 首（来源：Hi歌曲网 首页 + 热歌榜）'
                    : '暂无热门歌曲';
                if (force) MC.toast('热门歌曲已刷新');
            })
            .catch(function (e) {
                hotList.innerHTML = '<div class="empty-box">' + MC.escapeHtml(e.message || '网络错误') + '</div>';
                searchHint.textContent = '获取热门歌曲失败';
                MC.toast('获取热门歌曲失败：' + (e.message || '网络错误'), true);
            })
            .finally(function () {
                hotLoading = false;
                refreshBtn.disabled = false;
                refreshBtn.classList.remove('loading');
            });
    }
    refreshBtn.addEventListener('click', function () { loadHot(true); });
    loadHot(false);
})();
</script>
</body>
</html>
