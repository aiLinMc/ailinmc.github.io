<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>搜索 · 音乐下载器 · aiLinMc</title>
<meta name="description" content="aiLinMc 音乐下载器 —— 搜索歌曲、试听并下载。数据来源：Hi歌曲网。">
<link rel="stylesheet" href="assets/css/music.css">
</head>
<body>
<header class="topbar">
    <div class="brand">
        <span class="logo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
        <span>音乐下载器</span>
        <small>数据来源：Hi歌曲网</small>
    </div>
    <nav class="page-nav">
        <a class="nav-link" href="music.html">主页</a>
        <a class="nav-link active" href="search.html">搜索</a>
        <a class="nav-link" href="playlists.html">歌单</a>
    </nav>
    <button class="theme-btn" id="themeBtn"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg><span>深色模式</span></button>
</header>

<main class="wrap">
    <section class="search-area">
        <div class="search-box">
            <input id="searchInput" placeholder="输入歌曲名称，如：月亮" autocomplete="off" maxlength="60">
            <button class="search-btn" id="searchBtn">搜索</button>
        </div>
        <div class="history-wrap hidden" id="historyWrap">
            <div class="history-head">
                <span>搜索历史</span>
                <button class="history-clear" id="historyClear" type="button">清空</button>
            </div>
            <div class="history-chips" id="historyChips"></div>
        </div>
        <p class="hint" id="searchHint"></p>
    </section>

    <section class="panel">
        <div class="panel-head">
            <h2>搜索结果</h2>
            <span class="count" id="resultCount"></span>
        </div>
        <div class="result-list" id="resultList">
            <div class="empty-box">输入歌名并搜索，找到你想下载的歌曲</div>
        </div>
        <div class="pagination" id="pagination">
            <button class="page-btn" id="prevBtn">◀ 上一页</button>
            <span class="page-info" id="pageInfo"></span>
            <button class="page-btn" id="nextBtn">下一页 ▶</button>
        </div>
    </section>
</main>

<footer class="foot">⚠️ 本工具仅供内部使用，严禁对外传播、转载或用于商业用途 | 歌曲数据来源：Hi歌曲网 · https://higequ.com/</footer>

<div class="toast" id="toast"></div>

<script src="assets/js/music-common.js"></script>
<script>
(function () {
    'use strict';
    var MC = window.MusicCommon;
    MC.initTheme();
    MC.bindHistoryClear();
    MC.renderHistory(function (k) {
        searchInput.value = k;
        doSearch();
    });

    var searchInput = MC.$('searchInput');
    var searchBtn = MC.$('searchBtn');
    var searchHint = MC.$('searchHint');
    var resultList = MC.$('resultList');
    var resultCount = MC.$('resultCount');
    var prevBtn = MC.$('prevBtn');
    var nextBtn = MC.$('nextBtn');
    var pageInfo = MC.$('pageInfo');

    var state = { keyword: '', page: 1, totalPages: 1, results: null };
    var cache = new Map();
    var MAX_CACHE = 30;

    function clearCache() { cache.clear(); }

    function renderResults() {
        if (!state.results || !state.results.length) {
            resultList.innerHTML = '<div class="empty-box">未找到相关歌曲，换个关键词试试</div>';
            resultCount.textContent = '';
            return;
        }
        resultCount.textContent = '共 ' + state.results.length + ' 条';
        var frag = document.createDocumentFragment();
        state.results.forEach(function (r, i) {
            var item = document.createElement('div');
            item.className = 'result-item';
            item.innerHTML =
                '<span class="num">' + (i + 1) + '</span>' +
                '<div class="meta"><div class="title"></div><div class="artist"></div></div>' +
                '<span class="go">' + MC.icons.chevron + '</span>';
            item.querySelector('.title').textContent = r.title;
            item.querySelector('.artist').textContent = r.artist;
            item.addEventListener('click', function () {
                location.href = 'player.html?id=' + encodeURIComponent(r.id);
            });
            frag.appendChild(item);
        });
        resultList.innerHTML = '';
        resultList.appendChild(frag);
    }

    function renderPagination() {
        pageInfo.textContent = '第 ' + state.page + ' / ' + state.totalPages + ' 页';
        prevBtn.disabled = state.page <= 1;
        nextBtn.disabled = state.page >= state.totalPages;
    }

    function doSearch() {
        var keyword = searchInput.value.trim();
        if (!keyword) { MC.toast('请输入歌曲名称', true); return; }
        if (keyword !== state.keyword) {
            state.keyword = keyword;
            state.page = 1;
            clearCache();
        }
        fetchPage(state.page);
    }

    async function fetchPage(page) {
        var key = state.keyword + '|' + page;
        if (cache.has(key)) {
            var c = cache.get(key);
            state.page = page;
            state.results = c.results;
            state.totalPages = c.total_pages;
            renderResults(); renderPagination();
            searchHint.textContent = '第 ' + page + ' 页（缓存）';
            return;
        }
        searchBtn.disabled = true;
        searchHint.textContent = '正在搜索：' + state.keyword + '（第 ' + page + ' 页）…';
        resultList.innerHTML = '<div class="loading-box"><span class="spin"></span>搜索中…</div>';
        try {
            var res = await fetch('/api/music/search?keyword=' + encodeURIComponent(state.keyword) + '&page=' + page);
            var data = await res.json();
            if (!res.ok) throw MC.respError(data, res);
            state.page = page;
            state.results = data.results;
            state.totalPages = data.total_pages || 1;
            if (cache.size >= MAX_CACHE) cache.clear();
            cache.set(key, { results: data.results, total_pages: state.totalPages });
            renderResults(); renderPagination();
            MC.addHistory(state.keyword);
            searchHint.textContent = data.results.length
                ? '找到 ' + data.results.length + ' 首歌曲'
                : '未找到"' + state.keyword + '"的相关歌曲';
        } catch (e) {
            searchHint.textContent = '搜索失败';
            resultList.innerHTML = '<div class="empty-box">' + MC.escapeHtml(e.message || '网络错误') + '</div>';
            MC.toast('搜索失败：' + (e.message || '网络错误'), true);
        } finally {
            searchBtn.disabled = false;
        }
    }

    searchBtn.addEventListener('click', doSearch);
    searchInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(); });
    prevBtn.addEventListener('click', function () { if (state.page > 1) fetchPage(state.page - 1); });
    nextBtn.addEventListener('click', function () { if (state.page < state.totalPages) fetchPage(state.page + 1); });

    // 从主页跳转带 ?keyword= 时自动搜索
    var qs = new URLSearchParams(location.search);
    var kw = (qs.get('keyword') || '').trim();
    if (kw) {
        searchInput.value = kw;
        state.keyword = kw;
        state.page = 1;
        fetchPage(1);
    }
})();
</script>
</body>
</html>
