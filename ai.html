<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>AI 对话 · aiLinMc</title>
<meta name="description" content="aiLin AI 对话平台 —— 支持多对话、上下文压缩、图片上传、深度思考与流式输出。">
<!-- Markdown 渲染（失败时页面会自动降级为内置解析器） -->
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<!-- LaTeX 公式（不可用时原样显示公式源码，不会乱码） -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
    :root {
        --bg: #f5f6f8;
        --surface: #ffffff;
        --surface-2: #eceff3;
        --border: #e2e5ea;
        --text: #1b1f24;
        --muted: #6b7684;
        --accent: #2ea043;
        --accent-hover: #3fb950;
        --user-bubble: #2ea043;
        --user-text: #ffffff;
        --danger: #d1242f;
        --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 28px rgba(16, 24, 40, .06);
        --radius: 14px;
    }

    body.dark-mode {
        --bg: #0b0f14;
        --surface: #141c26;
        --surface-2: #1a2430;
        --border: #223040;
        --text: #e6edf3;
        --muted: #8b98a5;
        --user-bubble: #2ea043;
        --user-text: #ffffff;
        --danger: #f85149;
        --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                     "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        font-size: 15px;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
    }

    button { font-family: inherit; cursor: pointer; }
    textarea, input { font-family: inherit; }

    /* ==================== 布局 ==================== */
    .app { display: flex; height: 100dvh; overflow: hidden; }

    /* ---------- 侧边栏 ---------- */
    .sidebar {
        flex: 0 0 276px;
        width: 276px;
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border-right: 1px solid var(--border);
        z-index: 30;
        transition: margin-left .25s ease;
    }

    .sidebar-head {
        padding: 14px 14px 10px;
        border-bottom: 1px solid var(--border);
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 2px 4px 12px;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: .01em;
    }

    .brand .dot {
        width: 9px; height: 9px; border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 4px rgba(46, 160, 67, .15);
    }

    .brand small { color: var(--muted); font-weight: 500; font-size: 12px; }

    .new-chat {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface-2);
        color: var(--text);
        font-size: 14px;
        font-weight: 600;
        transition: background .15s, border-color .15s;
    }
    .new-chat:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

    .conv-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    .conv-empty {
        padding: 24px 12px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
    }

    .conv-item {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 10px;
        border-radius: 10px;
        color: var(--text);
        font-size: 14px;
        cursor: pointer;
        transition: background .15s;
    }
    .conv-item:hover { background: var(--surface-2); }
    .conv-item.active { background: var(--surface-2); font-weight: 600; }

    .conv-title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .conv-actions { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
    .conv-item:hover .conv-actions,
    .conv-item.active .conv-actions { opacity: 1; }

    .conv-act {
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        line-height: 1;
        padding: 4px 5px;
        border-radius: 6px;
    }
    .conv-act:hover { background: var(--border); color: var(--text); }
    .conv-act.del:hover { color: var(--danger); }

    .sidebar-foot {
        padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--border);
    }

    .ghost-btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 9px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        transition: background .15s, color .15s;
    }
    .ghost-btn:hover { background: var(--surface-2); color: var(--text); }

    .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .45);
        z-index: 25;
        backdrop-filter: blur(1px);
    }

    /* ---------- 主区 ---------- */
    .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: var(--bg);
    }

    .topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
    }

    .icon-btn {
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        font-size: 16px;
        line-height: 1;
        padding: 7px 9px;
        border-radius: 9px;
        transition: background .15s, color .15s;
    }
    .icon-btn:hover { background: var(--surface-2); color: var(--text); }

    .hamburger { display: inline-block; }

    .topbar-title {
        flex: 1;
        min-width: 0;
        font-size: 15px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .ctx-pill {
        flex: none;
        font-size: 12px;
        color: var(--muted);
        background: var(--surface-2);
        border: 1px solid var(--border);
        padding: 3px 9px;
        border-radius: 999px;
        white-space: nowrap;
    }

    /* ---------- 消息区 ---------- */
    .messages {
        flex: 1;
        overflow-y: auto;
        padding: 22px 16px 10px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        /* 这里刻意不用 scroll-behavior: smooth：
           流式输出每帧都会把滚动条拉到底，平滑滚动会被下一次赋值不断打断，
           表现为滚动卡在半途并抖动（公式渲染让高度反复跳变时尤其明显）。
           关闭滚动锚定，避免浏览器在流式替换 DOM 时自行调整滚动位置与自动滚动互相拉扯。 */
        overflow-anchor: none;
    }

    .msg {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 100%;
        max-width: 840px;
        margin: 0 auto;
    }

    /* 用户消息靠右；AI 消息铺满整行（AI 不再显示头像，所以也不留头像位） */
    .msg.user { align-items: flex-end; }
    .msg.ai { align-items: stretch; }

    .avatar {
        flex: none;
        width: 30px; height: 30px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        font-size: 14px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        user-select: none;
    }

    .bubble {
        max-width: min(78%, 640px);
        padding: 11px 14px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        word-break: break-word;
        overflow-wrap: anywhere;
    }

    /* AI 回复不套框，直接铺在背景上（错误提示除外，保留边框以便醒目） */
    /* 宽度固定为整行，只由容器决定，不随内容长短变化 */
    .msg.ai:not(.error) .bubble {
        width: 100%;
        max-width: 100%;
        padding: 0;
        border: none;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
    }

    .msg.user .bubble {
        background: var(--user-bubble);
        border-color: transparent;
        color: var(--user-text);
        box-shadow: none;
    }

    /* ---------- 消息下方的操作按钮 ---------- */
    .msg-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
    }
    .msg.user .msg-actions { justify-content: flex-end; }
    .msg-usage {
        flex: 0 0 100%;   /* 独占一行，按钮被挤到下一行 */
        font-size: 12px;
        color: var(--muted);
    }
    .msg-btn {
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--muted);
        font: inherit;
        font-size: 12px;
        line-height: 1;
        padding: 5px 11px;
        border-radius: 999px;
        cursor: pointer;
        transition: color .15s, border-color .15s, background .15s;
    }
    .msg-btn:hover { color: var(--text); border-color: var(--accent); }
    .msg-btn.primary {
        background: var(--accent);
        border-color: transparent;
        color: #fff;
    }
    .msg-btn.primary:hover { background: var(--accent-hover); color: #fff; }

    /* ---------- 用户消息的编辑态 ---------- */
    .msg-editor {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: min(100%, 640px);
    }
    .msg-editor textarea {
        width: 100%;
        min-height: 68px;
        resize: vertical;
        font: inherit;
        font-size: 14px;
        line-height: 1.55;
        padding: 10px 12px;
        border-radius: var(--radius);
        border: 1px solid var(--accent);
        background: var(--surface);
        color: var(--text);
        outline: none;
    }
    /* 顶部留出 6px：缩略图右上角的 × 会向上探出，避免被上方内容压住 */
    .edit-images { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 6px; }
    .edit-thumb { position: relative; width: 78px; height: 78px; }
    .edit-thumb img {
        width: 100%; height: 100%;
        object-fit: cover;
        border-radius: 10px;
        display: block;
        border: 1px solid rgba(127, 127, 127, .25);
        cursor: zoom-in;
    }
    .edit-thumb button {
        position: absolute;
        top: -6px; right: -6px;
        width: 20px; height: 20px;
        border: none;
        border-radius: 50%;
        background: var(--danger);
        color: #fff;
        font-size: 12px;
        line-height: 1;
        cursor: pointer;
        display: grid;
        place-items: center;
    }
    .edit-add {
        width: 78px; height: 78px;
        border: 1px dashed var(--border);
        border-radius: 10px;
        background: var(--surface);
        color: var(--muted);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
    }
    .edit-add:hover { color: var(--text); border-color: var(--accent); }

    .bubble .images {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 8px;
    }
    .bubble .images img {
        width: 132px; height: 132px;
        object-fit: cover;
        border-radius: 10px;
        cursor: zoom-in;
        border: 1px solid rgba(127, 127, 127, .25);
    }
    .msg.user .bubble .images { margin-bottom: 8px; }

    /* ---------- Markdown 渲染 ---------- */
    .bubble .content > *:first-child { margin-top: 0; }
    .bubble .content > *:last-child { margin-bottom: 0; }

    .bubble .content h1,
    .bubble .content h2,
    .bubble .content h3,
    .bubble .content h4 {
        margin: 14px 0 8px;
        line-height: 1.35;
        font-weight: 700;
    }
    .bubble .content h1 { font-size: 1.25em; }
    .bubble .content h2 { font-size: 1.15em; }
    .bubble .content h3 { font-size: 1.05em; }
    .bubble .content h4 { font-size: 1em; }

    .bubble .content p { margin: 8px 0; }

    .bubble .content ul,
    .bubble .content ol { margin: 8px 0; padding-left: 22px; }
    .bubble .content li { margin: 3px 0; }
    .bubble .content li > ul,
    .bubble .content li > ol { margin: 3px 0; }

    .bubble .content a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
    .msg.user .bubble .content a { color: #fff; }

    .bubble .content blockquote {
        margin: 8px 0;
        padding: 2px 0 2px 12px;
        border-left: 3px solid var(--border);
        color: var(--muted);
    }
    .msg.user .bubble .content blockquote { border-left-color: rgba(255, 255, 255, .5); color: rgba(255, 255, 255, .85); }

    .bubble .content hr {
        margin: 12px 0;
        border: none;
        border-top: 1px solid var(--border);
    }

    .bubble .content table {
        display: block;
        width: max-content;
        max-width: 100%;
        overflow-x: auto;
        border-collapse: collapse;
        margin: 10px 0;
        font-size: 13.5px;
    }
    .bubble .content th,
    .bubble .content td {
        border: 1px solid var(--border);
        padding: 6px 10px;
        text-align: left;
        white-space: nowrap;
    }
    .bubble .content th { background: var(--surface-2); font-weight: 600; }

    .bubble .content img { max-width: 100%; border-radius: 8px; }

    /* ---------- LaTeX 公式 ---------- */
    /* 长公式在窄屏可横向滚动，避免撑破布局 */
    .bubble .content .katex-display {
        overflow-x: auto;
        overflow-y: hidden;
        padding: 2px 0;
    }
    /* KaTeX 未加载时的兜底显示 */
    .math-plain {
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-size: .92em;
        color: var(--muted);
        background: var(--surface-2);
        padding: 1px 5px;
        border-radius: 5px;
        word-break: break-all;
    }

    .bubble pre {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 10px 12px;
        overflow-x: auto;
        margin: 8px 0;
        font-size: 13px;
        line-height: 1.55;
    }
    .msg.user .bubble pre { background: rgba(0, 0, 0, .18); border-color: rgba(255, 255, 255, .18); }
    .bubble code {
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-size: 13px;
    }
    .bubble :not(pre) > code {
        background: var(--surface-2);
        padding: 1px 5px;
        border-radius: 5px;
    }
    .msg.user .bubble :not(pre) > code { background: rgba(0, 0, 0, .18); }

    /* 流式输出时的光标 */
    .cursor-blink::after {
        content: "▍";
        margin-left: 1px;
        color: var(--accent);
        animation: caret 1s steps(1) infinite;
    }
    @keyframes caret { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

    .reasoning {
        margin-bottom: 9px;
        border-left: 2px solid var(--border);
        padding-left: 10px;
    }
    .reasoning summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 12.5px;
        user-select: none;
        list-style: none;
    }
    .reasoning summary::-webkit-details-marker { display: none; }
    .reasoning summary::before { content: "💡 "; }
    /* 箭头紧跟在状态文字右侧，方向由 open 属性决定（手动展开/收起也会同步） */
    .reasoning summary .arrow {
        display: inline-block;
        margin-left: 5px;
        font-size: 9px;
        line-height: 1;
    }
    .reasoning summary .arrow::before { content: "▶"; }
    .reasoning[open] summary .arrow::before { content: "▼"; }
    .reasoning[open] summary { margin-bottom: 6px; }
    .reasoning-body {
        color: var(--muted);
        font-size: 13px;
        white-space: pre-wrap;
    }

    /* 系统提示居中；错误提示仍保留头像与红框，所以维持横向布局 */
    .msg.system {
        align-items: center;
    }
    .msg.error {
        flex-direction: row;
        align-items: flex-start;
        gap: 10px;
    }
    .msg.system .notice {
        font-size: 12.5px;
        color: var(--muted);
        background: var(--surface-2);
        border: 1px solid var(--border);
        padding: 5px 12px;
        border-radius: 999px;
        max-width: 90%;
        text-align: center;
    }

    .msg.error .bubble {
        border-color: var(--danger);
        color: var(--danger);
        background: transparent;
        box-shadow: none;
    }
    .retry-btn {
        margin-top: 8px;
        border: 1px solid var(--danger);
        background: transparent;
        color: var(--danger);
        font-size: 12.5px;
        padding: 4px 12px;
        border-radius: 8px;
    }
    .retry-btn:hover { background: var(--danger); color: #fff; }

    .typing { display: flex; gap: 4px; padding: 3px 0; }
    .typing i {
        width: 7px; height: 7px;
        border-radius: 50%;
        background: var(--muted);
        animation: blink 1.2s infinite ease-in-out;
    }
    .typing i:nth-child(2) { animation-delay: .18s; }
    .typing i:nth-child(3) { animation-delay: .36s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

    /* 切换到大对话时先把「加载中」画出来，等下一帧再渲染消息 */
    .msg-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        padding: 48px 0;
        color: var(--muted);
        font-size: 13px;
    }
    .msg-loading .spin {
        width: 15px; height: 15px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- 欢迎页 ---------- */
    .welcome {
        margin: auto;
        text-align: center;
        max-width: 620px;
        padding: 24px 8px;
    }
    .welcome h1 { font-size: clamp(1.4rem, 5vw, 1.9rem); letter-spacing: .01em; }
    .welcome p { color: var(--muted); margin-top: 10px; font-size: 14px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 22px; }
    .chip {
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font-size: 13px;
        padding: 8px 14px;
        border-radius: 999px;
        transition: border-color .15s, transform .15s;
    }
    .chip:hover { border-color: var(--accent); transform: translateY(-1px); }

    /* ---------- 输入区 ---------- */
    .composer {
        padding: 10px 16px calc(14px + env(safe-area-inset-bottom));
        background: var(--bg);
    }

    .composer-inner { position: relative; max-width: 840px; margin: 0 auto; }

    /* 滑到最下：用户往上翻、不再跟随最新内容时才出现，浮在输入区正上方 */
    .scroll-btn {
        position: absolute;
        right: 0;
        bottom: calc(100% + 12px);
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 7px 13px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-size: 12.5px;
        box-shadow: var(--shadow);
        cursor: pointer;
        z-index: 5;
        opacity: 0;
        visibility: hidden;
        transform: translateY(6px);
        transition: opacity .18s ease, transform .18s ease, visibility .18s;
    }
    .scroll-btn.show { opacity: 1; visibility: visible; transform: none; }
    .scroll-btn:hover { background: var(--surface-2); }

    .img-previews { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .thumb {
        position: relative;
        width: 62px; height: 62px;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--border);
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb button {
        position: absolute;
        top: 2px; right: 2px;
        width: 18px; height: 18px;
        border: none;
        border-radius: 50%;
        background: rgba(0, 0, 0, .6);
        color: #fff;
        font-size: 12px;
        line-height: 1;
        display: grid;
        place-items: center;
    }

    .input-box {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 8px 8px 8px 6px;
        box-shadow: var(--shadow);
        transition: border-color .15s;
    }
    .input-box:focus-within { border-color: var(--accent); }

    #input {
        flex: 1;
        min-height: 24px;
        max-height: 168px;
        resize: none;
        border: none;
        outline: none;
        background: transparent;
        color: var(--text);
        font-size: 15px;
        line-height: 1.6;
        padding: 8px 6px;
    }
    #input::placeholder { color: var(--muted); }

<script>
(function () {

    // ================================================================

    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    // 对话 id：16 个 base64url 字符（96 bit 随机量），可直接放进 ?chat= 参数
    function newChatId() {
        const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
        const bytes = new Uint8Array(16);
        crypto.getRandomValues(bytes);
        let s = '';
        for (const b of bytes) s += alphabet[b & 63];   // 256 是 64 的整数倍，取低位无偏
        return s;
    }
    const isChatId = id => typeof id === 'string' && /^[A-Za-z0-9_-]{16}$/.test(id);

    let toastTimer = null;
    function toast(msg) {
        el.toast.textContent = msg;
        el.toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.toast.classList.remove('show'), 2600);
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => (
            { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        ));
    }

    // ================================================================
    //  LaTeX 公式
    // ================================================================
    // 必须在 Markdown 解析「之前」把公式抽成占位符，否则 a_i 的下划线会被当成
    // 斜体语法、跨行公式会被换行拆断。解析完再用 KaTeX 渲染回原位。
    function extractMath(src) {
        const store = [];

        // 先圈出代码块范围，代码里的 $ 不当公式
        const fences = [];
        let pos = 0;
        let inFence = false;
        let start = 0;
        for (const line of src.split('\n')) {
            if (/^\s*```/.test(line)) {
                if (inFence) fences.push([start, pos + line.length]);
                else start = pos;
                inFence = !inFence;
            }
            pos += line.length + 1;
        }
        if (inFence) fences.push([start, src.length]);
        const inFenceAt = p => fences.some(r => p >= r[0] && p < r[1]);

        // $$..$$ / \[..\] 为行间公式；\(..\) 与 $..$ 为行内公式。
        // 行内 $ 要求紧贴非空白字符，避免把「$100 和 $200」误判成公式。
        const re = /\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|\$(\S(?:[^\n$]*\S)?)\$/g;

        const text = src.replace(re, (match, dollarBody, offset) => {
            if (inFenceAt(offset)) return match;

            let display = false;
            let latex;
            if (match.startsWith('$$')) { display = true; latex = match.slice(2, -2); }
            else if (match.startsWith('\\[')) { display = true; latex = match.slice(2, -2); }
            else if (match.startsWith('\\(')) { latex = match.slice(2, -2); }
            else { latex = dollarBody; }

            store.push({ latex: latex.trim(), display: display });
            return '%%MATH' + (store.length - 1) + '%%';
        });

        return { text: text, store: store };
    }

    function restoreMath(html, store) {
        if (!store.length) return html;

        return html.replace(/%%MATH(\d+)%%/g, (match, n) => {
            const item = store[Number(n)];
            if (!item) return match;

            if (window.katex && window.katex.renderToString) {
                try {
                    return window.katex.renderToString(item.latex, {
                        displayMode: item.display,
                        throwOnError: false,
                        strict: false
                    });
                } catch (e) {
                    console.warn('公式渲染失败:', e);
                }
            }
            // KaTeX 不可用时原样显示公式源码，至少不会被 Markdown 弄乱
            const d = item.display;
            return '<span class="math-plain">'
                 + escapeHtml((d ? '\\[ ' : '\\(') + item.latex + (d ? ' \\]' : ' \\)'))
                 + '</span>';
        });
    }

    // Markdown 渲染：优先用 marked + DOMPurify；两者不可用时（CDN 被拦截等）
    // 自动改用下面的内置解析器，保证任何环境下都能正确渲染
    function renderMarkdown(text) {
        const src = String(text || '');
        const prepared = extractMath(src);

        let html = null;
        if (window.marked && window.DOMPurify) {
            try {
                html = window.DOMPurify.sanitize(window.marked.parse(prepared.text, { gfm: true, breaks: true }));
            } catch (e) {
                console.warn('marked 渲染异常，改用内置解析器:', e);
                html = null;
            }
        }
        if (html === null) html = renderMarkdownBuiltin(prepared.text);

        return restoreMath(html, prepared.store);
    }

    // 内置 Markdown 解析器：不依赖任何外部库
    // 支持标题、代码块、行内代码、粗体/斜体/删除线、有序/无序（含嵌套）列表、
    // 引用、分隔线、表格、链接、图片、自动链接与换行。
    // 所有文本先做 HTML 转义再拼标签，因此天然不会引入 XSS。
    function renderMarkdownBuiltin(text) {
        const src = String(text == null ? '' : text).replace(/\r\n?/g, '\n');

        const isFence = s => /^\s*```/.test(s);
        const isHr = s => /^\s*([-*_])\s*(\1\s*){2,}$/.test(s);
        const isHeading = s => /^\s{0,3}#{1,6}\s+/.test(s);
        const isQuote = s => /^\s{0,3}>\s?/.test(s);
        const isList = s => /^\s*(?:[-*+]|\d+[.)])\s+/.test(s);
        const indentOf = s => s.match(/^\s*/)[0].replace(/\t/g, '    ').length;

        const inline = s => escapeHtml(s)
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/!\[([^\]]*)\]\((https?:[^)\s]+)\)/g, '<img src="$2" alt="$1">')
            .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
            .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>')
            .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
            .replace(/__([^_]+)__/g, '<strong>$1</strong>')
            .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
            .replace(/(^|[^_\w])_([^_\n]+)_/g, '$1<em>$2</em>')
            .replace(/~~([^~]+)~~/g, '<del>$1</del>');

        // 递归解析列表，按缩进支持一层及以上的嵌套
        const parseList = (ls, start, indent) => {
            const tag = /^\s*\d+[.)]\s+/.test(ls[start]) ? 'ol' : 'ul';
            let out = '<' + tag + '>';
            let i = start;

            while (i < ls.length) {
                const m = ls[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
                if (!m || indentOf(ls[i]) !== indent) break;

                out += '<li>' + inline(m[3]);
                i++;

                // 该项的续行（缩进对齐的普通文本）
                while (i < ls.length && /^\s{2,}\S/.test(ls[i]) && !isList(ls[i]) && !isHr(ls[i])) {
                    out += '<br>' + inline(ls[i].trim());
                    i++;
                }
                // 更深的缩进视为子列表
                if (i < ls.length && isList(ls[i]) && indentOf(ls[i]) > indent) {
                    const sub = parseList(ls, i, indentOf(ls[i]));
                    out += sub.html;
                    i = sub.next;
                }
                out += '</li>';
            }
            return { html: out + '</' + tag + '>', next: i };
        };

        const isBlockStart = s => isFence(s) || isHr(s) || isHeading(s) || isQuote(s) || isList(s);

        const lines = src.split('\n');
        let html = '';
        let i = 0;

        while (i < lines.length) {
            const line = lines[i];

            // 空行
            if (/^\s*$/.test(line)) { i++; continue; }

            // 代码块
            if (isFence(line)) {
                const lang = line.replace(/^\s*```/, '').trim();
                const buf = [];
                i++;
                while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
                i++;   // 跳过结束围栏
                html += '<pre><code' + (lang ? ' class="lang-' + escapeHtml(lang) + '"' : '') + '>'
                      + escapeHtml(buf.join('\n')) + '</code></pre>';
                continue;
            }

            // 分隔线
            if (isHr(line)) { html += '<hr>'; i++; continue; }

            // 标题
            if (isHeading(line)) {
                const m = line.match(/^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/);
                const n = m[1].length;
                html += '<h' + n + '>' + inline(m[2]) + '</h' + n + '>';
                i++;
                continue;
            }

            // 引用（整块交给递归处理）
            if (isQuote(line)) {
                const buf = [];
                while (i < lines.length && isQuote(lines[i])) {
                    buf.push(lines[i].replace(/^\s{0,3}>\s?/, ''));
                    i++;
                }
                html += '<blockquote>' + renderMarkdownBuiltin(buf.join('\n')) + '</blockquote>';
                continue;
            }

            // 表格：本行含 |，且下一行是分隔行
            if (line.indexOf('|') !== -1 && i + 1 < lines.length &&
                /^[\s:|-]+$/.test(lines[i + 1]) && lines[i + 1].indexOf('-') !== -1) {
                const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
                const head = cells(line);
                i += 2;
                const rows = [];
                while (i < lines.length && lines[i].indexOf('|') !== -1 && !/^\s*$/.test(lines[i])) {
                    rows.push(cells(lines[i]));
                    i++;
                }
                html += '<table><thead><tr>' + head.map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead>'
                      + '<tbody>' + rows.map(r => '<tr>' + r.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('')
                      + '</tbody></table>';
                continue;
            }

            // 列表
            if (isList(line)) {
                const res = parseList(lines, i, indentOf(line));
                html += res.html;
                i = res.next;
                continue;
            }

            // 普通段落（连续非块起始行合并，行内换行保留为 <br>）
            const buf = [];
            while (i < lines.length && !/^\s*$/.test(lines[i]) && !isBlockStart(lines[i])) {
                buf.push(lines[i]);
                i++;
            }
            if (buf.length) html += '<p>' + buf.map(inline).join('<br>') + '</p>';
            else i++;   // 兜底，避免死循环
        }

        return html;
    }

    // ================================================================
    //  IndexedDB 存储层
    // ================================================================
    function openDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onupgradeneeded = e => {
                const d = e.target.result;
                if (!d.objectStoreNames.contains(STORE)) {
                    const store = d.createObjectStore(STORE, { keyPath: 'id' });
                    store.createIndex('updatedAt', 'updatedAt');
                }
            };
            req.onsuccess = () => { db = req.result; resolve(db); };
            req.onerror = () => reject(req.error);
        });
    }

    const store = mode => db.transaction(STORE, mode).objectStore(STORE);

    function dbPut(conv) {
        return new Promise((resolve, reject) => {
            const r = store('readwrite').put(conv);
            r.onsuccess = () => resolve();
            r.onerror = () => reject(r.error);
        });
    }

    function dbDelete(id) {
        return new Promise((resolve, reject) => {
            const r = store('readwrite').delete(id);
            r.onsuccess = () => resolve();
            r.onerror = () => reject(r.error);
        });
    }

    function dbGetAll() {
        return new Promise((resolve, reject) => {
            const r = store('readonly').getAll();
            r.onsuccess = () => resolve(r.result || []);
            r.onerror = () => reject(r.error);
        });
    }

    // ================================================================
    //  对话模型
    // ================================================================
    function createConversation() {
        return {
            id: newChatId(),
            title: '新对话',
            createdAt: Date.now(),
            updatedAt: Date.now(),
            messages: [],       // { id, role, content, images, reasoning, ts }
            summary: '',        // 上下文压缩后的摘要
            compressIndex: 0,   // messages[0, compressIndex) 已被摘要覆盖
            compressCount: 0,
            titleAuto: false,   // 已由模型生成过标题
            titleManual: false  // 用户手动重命名过，不再自动覆盖
        };
    }

    const currentConv = () => conversations.find(c => c.id === currentId) || null;

    // 距离上次压缩已经过的用户轮次
    const turnsSinceCompress = conv =>
        conv.messages.slice(conv.compressIndex).filter(m => m.role === 'user').length;

    function buildApiMessages(conv) {
        const msgs = [];
        let sys = SYSTEM_PROMPT;
        if (conv.summary) {
            sys += '\n\n【此前对话摘要】（更早的内容已压缩，请视为已知上下文）\n' + conv.summary;
        }
        msgs.push({ role: 'system', content: sys });

        conv.messages.slice(conv.compressIndex).forEach(m => {
            if (m.role === 'system') return;                 // 系统提示（如压缩通知）不发送
            if (m.role === 'assistant') {
                msgs.push({ role: 'assistant', content: m.content || '' });
                return;
            }
            if (m.images && m.images.length) {
                const content = [];
                if (m.content) content.push({ type: 'text', text: m.content });
                m.images.forEach(url => content.push({ type: 'image_url', image_url: { url } }));
                msgs.push({ role: 'user', content });
            } else {
                msgs.push({ role: 'user', content: m.content || '' });
            }
        });
        return msgs;
    }

    // 思考参数：关闭思考时显式下发 disabled；开启时附带强度档位
    function thinkingOptions() {
        if (!el.thinkToggle.checked) return { thinking: { type: 'disabled' } };

    // 按当前设置组装请求（含调试模式直连）
    function buildRequest(thinkingOpts, stream) {
        const payload = { temperature: 0.8, max_tokens: MAX_TOKENS };
        Object.assign(payload, thinkingOpts);

        const headers = { 'Content-Type': 'application/json' };
        let url = stream ? STREAM_URL : API_URL;

        if (debug.enabled && debug.key) {
            // 调试模式：绕过站点代理，直接用自填密钥请求
            url = debug.endpoint;
            headers.Authorization = 'Bearer ' + debug.key;
            payload.model = debug.model;
        }
        payload.stream = stream;
        return { url, headers, payload };
    }

    // 非流式调用（上下文压缩，以及流式不可用时的兜底）
    async function callChat(apiMessages, thinkingOpts, retries = 3) {
        const { url, headers, payload } = buildRequest(thinkingOpts, false);
        payload.messages = apiMessages;

        let lastErr = null;
        for (let i = 0; i < retries; i++) {
            try {
                const resp = await fetch(url, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(payload)
                });
                if (!resp.ok) {
                    const t = await resp.text();
                    throw new Error('HTTP ' + resp.status + (t ? ': ' + t.slice(0, 160) : ''));
                }
                const data = await resp.json();
                if (!data.choices || !data.choices[0] || !data.choices[0].message) {
                    throw new Error('返回数据格式异常');
                }
                const msg = data.choices[0].message;   // { content, reasoning_content? }
                msg.usage = data.usage;                // 顺带带回 token 用量
                return msg;
            } catch (e) {
                lastErr = e;
                console.warn('AI 调用失败（第 ' + (i + 1) + ' 次）:', e);
                if (i < retries - 1) await sleep(1200);
            }
        }
        throw lastErr;
    }

    // 流式调用：逐块回调 onDelta({ content, reasoning })
    async function streamChat(apiMessages, thinkingOpts, onDelta) {
        const { url, headers, payload } = buildRequest(thinkingOpts, true);
        payload.messages = apiMessages;

        const resp = await fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(payload) });
        if (!resp.ok) {
            const t = await resp.text();
            throw new Error('HTTP ' + resp.status + (t ? ': ' + t.slice(0, 160) : ''));
        }
        if (!resp.body) throw new Error('当前环境不支持流式读取');

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let content = '';
        let reasoning = '';
        let usage = null;
        let finished = false;   // 是否收到结束标记（finish_reason 或 [DONE]）

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });

            // SSE 逐行解析，最后一行可能是残片，留到下一轮
            const lines = buffer.split('\n');
            buffer = lines.pop();
            for (const line of lines) {
                const text = line.trim();
                if (!text.startsWith('data:')) continue;
                const data = text.slice(5).trim();
                if (!data) continue;
                if (data === '[DONE]') { finished = true; continue; }

                let json;
                try { json = JSON.parse(data); } catch (e) { continue; }
                if (json.usage) usage = json.usage;   // 末块带 usage，先收下来
                const choice = json.choices && json.choices[0];
                if (choice && choice.finish_reason) finished = true;
                const delta = choice && choice.delta;
                if (!delta) continue;
                if (delta.reasoning_content) reasoning += delta.reasoning_content;
                if (delta.content) content += delta.content;
                if (delta.reasoning_content || delta.content) onDelta({ content, reasoning });
            }
        }
        // 连接被中途掐断（例如超出平台单次请求时限）不会报错，只会提前结束；
        // 这里显式识别，避免半截思考/回复被当成完整结果保存下来
        if (!finished) {
            const err = new Error('流式响应被中断，内容不完整（可能超出平台单次请求时限）');
            err.truncated = true;
            throw err;
        }
        return { content, reasoning, usage };
    }

    // keepScroll 为 true 时保持当前滚动位置（进/出编辑态用），否则贴底（新消息、流式结束）
    function renderMessages(keepScroll) {
        const prevTop = el.messages.scrollTop;
        el.messages.innerHTML = '';
        const conv = currentConv();

        if (!conv || !conv.messages.length) {
            el.messages.appendChild(buildWelcome());
            return;
        }

        conv.messages.forEach((m, i) => el.messages.appendChild(buildMessageEl(m, i === conv.messages.length - 1)));

        if (lastError) {
            el.messages.appendChild(buildErrorEl(lastError));
        }
        if (sending) {
            el.messages.appendChild(buildTypingEl());
        }
        if (keepScroll) el.messages.scrollTop = prevTop;
        else scrollToBottom();
    }

    function buildLoadingEl() {
        const box = document.createElement('div');
        box.className = 'msg-loading';
        const spin = document.createElement('span');

    // 消息多的对话渲染一次要花上百毫秒，先画出「加载中」，下一帧再渲染，避免点了没反应
    function renderMessagesWithLoading() {
        stickToBottom = true;   // 打开/切换对话时重新跟随最新内容
        updateScrollBtn();
        const conv = currentConv();
        if (!conv || conv.messages.length < 12) {   // 消息少就直接渲染，省得闪一下
            renderMessages();

        el.messages.appendChild(buildLoadingEl());
        // 双 rAF：第一个回调结束后浏览器会先绘制「加载中」，再轮到第二个回调做重活
        requestAnimationFrame(() => requestAnimationFrame(() => renderMessages()));

    function buildReasoningEl(labelText, bodyText) {

    // 思考用时文案，未记录用时（如非流式回退）时不显示括号
    const thinkSeconds = (start, end) => Math.max(1, Math.round((end - start) / 1000));
    const reasoningDoneText = sec => sec ? '思考完成（用时' + sec + '秒）' : '思考完成';

    // ================================================================
    //  消息下方操作：复制 / 修改
    // ================================================================
    function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(text);
        }
        // 非安全上下文（如本地 http 调试）没有 clipboard API，退回 execCommand
        return new Promise((resolve, reject) => {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.cssText = 'position:fixed;left:-9999px;top:0;';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy') ? resolve() : reject(new Error('execCommand 复制失败'));
            } catch (e) {
                reject(e);
            } finally {
                ta.remove();
            }
        });
    }

    function makeCopyBtn(label, getText) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'msg-btn';
        btn.textContent = label;
        btn.addEventListener('click', async () => {
            try {
                await copyText(getText());
                btn.textContent = '已复制';
            } catch (e) {
                btn.textContent = '复制失败';
            }
            setTimeout(() => { btn.textContent = label; }, 1400);
        });
        return btn;
    }

    // token 用量文案，如「输入 1,234 · 输出 567 · 共 1,801 tokens」；没有用量数据时返回空串
    function usageText(u) {
        if (!u) return '';
        const num = v => (typeof v === 'number' ? v.toLocaleString('en-US') : null);
        const i = num(u.prompt_tokens), o = num(u.completion_tokens), t = num(u.total_tokens);
        const parts = [];
        if (i !== null) parts.push('输入 ' + i);
        if (o !== null) parts.push('输出 ' + o);
        if (t !== null) parts.push('共 ' + t + ' tokens');
        return parts.join(' · ');
    }

    // 借用渲染结果取可见文字，比用正则剥离 Markdown 语法更贴近屏幕上看到的内容
    function mdToPlainText(md) {
        const holder = document.createElement('div');
        holder.style.cssText = 'position:fixed;left:-9999px;top:0;width:840px;';
        holder.innerHTML = renderMarkdown(md || '');
        // KaTeX 会同时输出 MathML 与视觉两层，去掉隐藏层避免同一个公式被复制两遍
        holder.querySelectorAll('.katex-mathml').forEach(n => n.remove());
        document.body.appendChild(holder);
        const text = holder.innerText.replace(/\n{3,}/g, '\n\n').trim();
        holder.remove();
        return text;
    }

    function buildUserActions(m) {
        const box = document.createElement('div');
        box.className = 'msg-actions';
        box.appendChild(makeCopyBtn('复制', () => m.content || ''));

        const edit = document.createElement('button');
        edit.type = 'button';
        edit.className = 'msg-btn';
        edit.textContent = '修改';
        edit.addEventListener('click', () => {
            if (sending) return;
            editingId = m.id;
            renderMessages(true);   // 原地进入编辑态，不改变滚动位置
        });
        box.appendChild(edit);
        return box;
    }

    function buildAiActions(m, isLast) {
        const box = document.createElement('div');
        box.className = 'msg-actions';

        const usage = usageText(m.usage);
        if (usage) {
            const span = document.createElement('span');
            span.className = 'msg-usage';
            span.textContent = usage;
            box.appendChild(span);
        }

        box.appendChild(makeCopyBtn('复制纯文本', () => mdToPlainText(m.content)));
        box.appendChild(makeCopyBtn('复制md文本', () => m.content || ''));

        // 只有最后一条回复能重新生成，重新生成更早的回复会让后续对话失去依据
        if (isLast) {
            const again = document.createElement('button');
            again.type = 'button';
            again.className = 'msg-btn';
            again.textContent = '重新生成';
            again.addEventListener('click', () => regenerate());
            box.appendChild(again);
        }
        return box;
    }

    // 丢弃最后一条回复并重新请求
    async function regenerate() {
        if (sending) return;
        const conv = currentConv();
        if (!conv) return;

        const last = conv.messages[conv.messages.length - 1];
        if (!last || last.role !== 'assistant') return;

        conv.messages.pop();
        editingId = null;
        lastError = null;
        conv.updatedAt = Date.now();

        await persist(conv);
        renderMessages();
        await requestReply(conv);
    }

    // 编辑态：文字变成输入框，图片可自由增删
    function buildUserEditor(m) {
        const box = document.createElement('div');
        box.className = 'msg-editor';

        const area = document.createElement('textarea');
        area.value = m.content || '';
        area.addEventListener('input', () => {
            area.style.height = 'auto';
            area.style.height = Math.min(area.scrollHeight, 240) + 'px';
        });

        let images = (m.images || []).slice();

        const picker = document.createElement('input');
        picker.type = 'file';
        picker.accept = 'image/*';
        picker.multiple = true;
        picker.hidden = true;
        picker.addEventListener('change', async () => {
            const list = Array.from(picker.files).filter(f => f.type.startsWith('image/'));
            for (const f of list) {
                if (images.length >= 6) { toast('单条消息最多 6 张图片'); break; }
                try {
                    images.push(await compressImage(f));
                } catch (e) {
                    toast('图片读取失败：' + f.name);
                }
            }
            picker.value = '';
            renderImages();
        });

        const gallery = document.createElement('div');
        gallery.className = 'edit-images';

        function renderImages() {
            gallery.innerHTML = '';
            images.forEach((src, idx) => {
                const t = document.createElement('div');
                t.className = 'edit-thumb';
                const img = document.createElement('img');
                img.src = src;
                img.alt = '图片';
                img.addEventListener('click', () => openLightbox(src));
                const rm = document.createElement('button');
                rm.type = 'button';
                rm.textContent = '×';
                rm.title = '删除这张图片';
                rm.addEventListener('click', () => { images.splice(idx, 1); renderImages(); });
                t.appendChild(img);
                t.appendChild(rm);
                gallery.appendChild(t);
            });
            if (images.length < 6) {
                const add = document.createElement('button');
                add.type = 'button';
                add.className = 'edit-add';
                add.textContent = '＋ 图片';
                add.addEventListener('click', () => picker.click());
                gallery.appendChild(add);
            }
        }
        renderImages();

        const acts = document.createElement('div');
        acts.className = 'msg-actions';

        const cancel = document.createElement('button');
        cancel.type = 'button';
        cancel.className = 'msg-btn';
        cancel.textContent = '取消';
        cancel.addEventListener('click', () => { editingId = null; renderMessages(true); });

        const save = document.createElement('button');
        save.type = 'button';
        save.className = 'msg-btn primary';
        save.textContent = '保存并重新生成';
        save.addEventListener('click', () => saveEdit(m, area.value.trim(), images));

        acts.appendChild(cancel);
        acts.appendChild(save);

        // 图片行放在输入框上方，与主输入框的图片预览顺序保持一致
        box.appendChild(gallery);
        box.appendChild(area);
        box.appendChild(picker);
        box.appendChild(acts);

        // 进入编辑态后聚焦，光标落在末尾；preventScroll 保证聚焦不会带着页面滚动
        setTimeout(() => {
            area.focus({ preventScroll: true });
            area.setSelectionRange(area.value.length, area.value.length);
            area.style.height = 'auto';
            area.style.height = Math.min(area.scrollHeight, 240) + 'px';
        }, 0);

        return box;
    }

    // 保存修改：覆盖原消息内容，丢弃它之后的内容（那些回复基于旧内容），再重新生成
    async function saveEdit(m, text, images) {
        const conv = currentConv();
        if (!conv) return;
        if (!text && !images.length) { toast('内容不能为空'); return; }

        const idx = conv.messages.indexOf(m);
        if (idx < 0) return;

        m.content = text;
        m.images = images;
        m.ts = Date.now();
        conv.messages.splice(idx + 1);          // 后续对话已失效
        if (idx === 0 && !conv.titleManual) {
            conv.title = makeTitle(m);          // 先用首句兜底，随后由模型重新生成
            conv.titleAuto = false;
        }

        // 压缩游标若落在被删掉的区间里，摘要已无对应内容，一并重置
        if (conv.compressIndex > idx) {
            conv.compressIndex = 0;
            conv.summary = '';
        }

        editingId = null;
        lastError = null;
        conv.updatedAt = Date.now();

        await persist(conv);
        sortConversations();
        renderConvList();
        renderMessages();
        renderHeader();

        await requestReply(conv);
    }

    function buildMessageEl(m, isLast) {
        const wrap = document.createElement('div');

        if (m.role === 'system') {
            wrap.className = 'msg system';
            const n = document.createElement('div');
            n.className = 'notice';
            n.textContent = m.content;
            wrap.appendChild(n);
            return wrap;
        }

        const isUser = m.role === 'user';
        wrap.className = 'msg ' + (isUser ? 'user' : 'ai');

        if (isUser && m.id === editingId) {
            wrap.appendChild(buildUserEditor(m));
            return wrap;
        }

        const bubble = document.createElement('div');
        bubble.className = 'bubble';

        if (isUser && m.images && m.images.length) {

            gallery.className = 'images';

                img.alt = '图片';

                gallery.appendChild(img);
            });
            bubble.appendChild(gallery);
        }

        if (!isUser && m.reasoning) {
            bubble.appendChild(buildReasoningEl(reasoningDoneText(m.reasonSec), m.reasoning).details);
        }

        const content = document.createElement('div');
        content.className = 'content';
        content.innerHTML = renderMarkdown(m.content);
        bubble.appendChild(content);

        wrap.appendChild(bubble);

        // AI 回复结束后才挂上复制按钮；空内容（如失败的回复）不挂
        if (isUser) {
            wrap.appendChild(buildUserActions(m));
        } else if ((m.content || '').trim()) {
            wrap.appendChild(buildAiActions(m, isLast));
        }

        return wrap;
    }

    // 自动滚动只在用户本来就在底部时发生；用户自己往上翻后就不再跟随，直到他重新滚回底部
    let stickToBottom = true;

    // 自动滚动一律瞬时定位（容器未开启平滑滚动），保证流式刷新时始终贴在底部
    // force = true 用于用户主动发消息 / 点「滑到最下」这类明确要求回到最新位置的情况
    function scrollToBottom(force) {

    // 通用对话框，替代浏览器自带的 prompt / confirm：
    // 传了 input 就是输入框（确定后返回去掉首尾空白的文字，取消或留空返回 null），否则是确认框（返回 true / false）
    let dlgResolve = null;      // 当前对话框的 resolve
    let dlgInputMode = false;   // 当前是否为输入框模式

    function showDialog(opts) {
        return new Promise(resolve => {
            dlgResolve = resolve;
            dlgInputMode = opts.input !== undefined;
            el.dlgTitle.textContent = opts.title || '';
            el.dlgSub.textContent = opts.message || '';
            el.dlgSub.style.display = opts.message ? '' : 'none';
            el.dlgField.style.display = dlgInputMode ? '' : 'none';
            el.dlgInput.value = dlgInputMode ? opts.input : '';
            el.dlgOk.textContent = opts.okText || '确定';
            el.dlgOk.className = opts.danger ? 'danger' : 'primary';
            el.dlgMask.classList.add('show');
            // 输入框模式聚焦到文字末尾；确认框聚焦卡片，回车/Esc 依然可用
            if (dlgInputMode) {
                el.dlgInput.focus();
                el.dlgInput.setSelectionRange(el.dlgInput.value.length, el.dlgInput.value.length);
            } else {
                el.dlgCard.focus();
            }
        });
    }

    function closeDialog(ok) {
        if (!dlgResolve) return;
        const resolve = dlgResolve;
        dlgResolve = null;
        el.dlgMask.classList.remove('show');
        resolve(dlgInputMode ? (ok ? (el.dlgInput.value.trim() || null) : null) : !!ok);
    }

    async function renameConv(conv) {

            input: conv.title,
            okText: '保存'
        });
        if (name === null) return;
        conv.title = name.slice(0, 40);
        conv.titleManual = true;   // 用户手动命名过，不再被自动标题覆盖

        sortConversations();
        renderConvList();
        renderHeader();

    async function deleteConv(conv) {
        const ok = await showDialog({
            title: '删除对话',
            message: '确定删除「' + conv.title + '」吗？该对话的所有消息都会被移除，且不可恢复。',
            okText: '删除',
            danger: true
        });
        if (!ok) return;
        try {
            await dbDelete(conv.id);
        } catch (e) {
