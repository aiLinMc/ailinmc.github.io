            return;
        }
        conversations = conversations.filter(c => c.id !== conv.id);
        if (currentId === conv.id) {
            currentId = null;
            localStorage.removeItem('ai_currentConv');
        }
        lastError = null;
        syncChatUrl();
        renderConvList();
        renderMessages();
        renderHeader();
    }

    function sortConversations() {
        conversations.sort((a, b) => b.updatedAt - a.updatedAt);
    }

    function makeTitle(msg) {
        const base = (msg.content || '').trim().replace(/\s+/g, ' ');
        if (!base) return msg.images && msg.images.length ? '图片对话' : '新对话';
        return base.length > TITLE_MAX ? base.slice(0, TITLE_MAX) + '…' : base;
    }

    // 首轮问答结束后，让模型给这个新对话起个标题（20 字以内、不带句号）
    async function generateTitle(conv) {
        if (conv.titleAuto || conv.titleManual) return;
        if (conv.messages.length !== 2) return;              // 只在第 1 轮结束时做
        const ask = conv.messages[0];
        const ans = conv.messages[1];
        if (!ask || ask.role !== 'user' || !(ask.content || '').trim()) return;
        if (!ans || ans.role !== 'assistant' || !(ans.content || '').trim()) return;

        conv.titleAuto = true;   // 先占位，避免并发重复请求
        let res;
        try {
            res = await callChat([
                {
                    role: 'system',
                    content: '你负责给对话起标题。只输出标题本身，不要引号、不要句号、不要任何解释或前缀。'
                },
                {
                    role: 'user',
                    content: '用户：' + ask.content.slice(0, 500) +
                        '\n\n助手：' + ans.content.slice(0, 500) +
                        '\n\n请为这段对话起一个 ' + AI_TITLE_MAX + ' 字以内的中文标题。'
                }
            ], { thinking: { type: 'disabled' } }, 2);      // 起标题是简单任务，关闭思考省时间
        } catch (e) {
            conv.titleAuto = false;   // 失败就允许下次重试
            console.warn('生成标题失败:', e);
            return;
        }

        let title = (res && res.content ? res.content : '').trim();
        title = title.split('\n')[0].trim();                                   // 只要第一行
        title = title.replace(/^[“"'`《〈【\[（(]+/, '').replace(/[”"'`》〉】\]）)]+$/, '');  // 去掉包裹的引号括号
        title = title.replace(/[。.！!？?，,、;；:：\s]+$/, '');                  // 去掉结尾标点
        title = title.slice(0, AI_TITLE_MAX).trim();
        if (!title) { conv.titleAuto = false; return; }

        conv.title = title;
        await persist(conv);
        renderConvList();
        renderHeader();
    }

    // ================================================================
    //  发送流程
    // ================================================================
    async function submit() {
        if (sending) return;

        const text = el.input.value.trim();
        if (!text && !pendingImages.length) return;

        editingId = null;   // 发送新消息时退出编辑态，避免编辑框与新消息并存

        // 没有当前对话则新建（懒创建，避免留下空对话）
        let conv = currentConv();
        if (!conv) {
            conv = createConversation();
            conversations.unshift(conv);
            currentId = conv.id;
            localStorage.setItem('ai_currentConv', conv.id);
            syncChatUrl();   // 新对话在发出第一条消息后才把 ?chat= 写进地址栏
        }

        const msg = {
            id: uid(),
            role: 'user',
            content: text,
            images: pendingImages.slice(),
            ts: Date.now()
        };
        conv.messages.push(msg);
        if (conv.messages.filter(m => m.role === 'user').length === 1) {
            conv.title = makeTitle(msg);
        }
        conv.updatedAt = Date.now();

        // 清空输入
        el.input.value = '';
        autoGrow();
        pendingImages = [];
        renderPreviews();
        lastError = null;

        await persist(conv);
        sortConversations();
        renderConvList();
        renderMessages();
        renderHeader();

        await requestReply(conv);
    }

    // 流式输出时的临时气泡：内容与思考过程就地更新，结束后由 renderMessages 统一重绘
    function appendStreamingBubble() {
        const wrap = document.createElement('div');
        wrap.className = 'msg ai';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';

        const think = buildReasoningEl('思考中', '');
        const details = think.details;
        details.hidden = true;
        const reasonBody = think.body;

        const content = document.createElement('div');
        content.className = 'content cursor-blink';

        const typing = document.createElement('div');
        typing.className = 'typing';
        typing.innerHTML = '<i></i><i></i><i></i>';

        bubble.appendChild(details);
        bubble.appendChild(content);
        bubble.appendChild(typing);
        wrap.appendChild(bubble);
        el.messages.appendChild(wrap);
        scrollToBottom();

        let thinkStarted = false;
        let thinkDone = false;

        return {
            setReasoning(text) {
                details.hidden = !text;
                // 思考中保持展开
                if (text && !thinkStarted && !thinkDone) {
                    thinkStarted = true;
                    details.open = true;
                }
                reasonBody.textContent = text || '';
            },
            finishThinking(sec) {
                if (thinkDone) return;
                thinkDone = true;
                if (details.hidden) return;
                details.open = false;          // 思考完毕自动折叠
                think.label.textContent = reasoningDoneText(sec);
            },
            setContent(html) {
                if (typing.parentNode) typing.remove();
                content.innerHTML = html;
            },
            remove() { wrap.remove(); }
        };
    }

    async function requestReply(conv) {
        if (sending) return;
        lastError = null;
        // 主动发消息/重新生成：恢复跟随，下面的重绘会把视图拉到底部
        stickToBottom = true;
        updateScrollBtn();
        // 先按“未发送”状态重绘历史，避免同时出现加载小圆点与流式气泡
        renderMessages();
        sending = true;
        updateSendState();

        const bubble = appendStreamingBubble();
        let content = '';
        let reasoning = '';
        let frame = null;
        let thinkStart = 0;   // 首次收到思考内容的时间
        let thinkEnd = 0;

        const flush = () => {
            frame = null;
            bubble.setReasoning(reasoning);
            bubble.setContent(renderMarkdown(content));
            scrollToBottom();
        };
        // 高频 token 下按帧合并渲染，避免每个字都重新解析 Markdown
        const schedule = () => { if (frame === null) frame = requestAnimationFrame(flush); };
        // 正文开始输出即视为思考结束：记录用时并自动折叠
        const endThinking = () => {
            if (!thinkStart || thinkEnd) return;
            thinkEnd = Date.now();
            bubble.finishThinking(thinkSeconds(thinkStart, thinkEnd));
        };

        try {
            const result = await streamChat(buildApiMessages(conv), thinkingOptions(), d => {
                content = d.content;
                reasoning = d.reasoning;
                if (reasoning && !thinkStart) thinkStart = Date.now();
                if (content) endThinking();
                schedule();
            });
            content = result.content || content;
            reasoning = result.reasoning || reasoning;
            if (reasoning) endThinking();

            if (frame !== null) { cancelAnimationFrame(frame); frame = null; }
            bubble.setReasoning(reasoning);
            bubble.setContent(renderMarkdown(content));

            conv.messages.push({
                id: uid(),
                role: 'assistant',
                content: content,
                reasoning: reasoning,
                reasonSec: thinkStart && thinkEnd ? thinkSeconds(thinkStart, thinkEnd) : 0,
                usage: result.usage || null,
                ts: Date.now()
            });
            conv.updatedAt = Date.now();
            await persist(conv);
        } catch (streamErr) {
            if (frame !== null) { cancelAnimationFrame(frame); frame = null; }
            if (streamErr && streamErr.truncated) {
                // 流被平台掐断时非流式请求同样会超时，回退没有意义；
                // 保留已经收到的半截内容（不白等一场），同时在下方给出明确提示
                console.warn('流式响应被中断:', streamErr);
                if (content || reasoning) {
                    conv.messages.push({
                        id: uid(),
                        role: 'assistant',
                        content: content,
                        reasoning: reasoning,
                        reasonSec: thinkStart && thinkEnd ? thinkSeconds(thinkStart, thinkEnd) : 0,
                        usage: null,
                        ts: Date.now()
                    });
                    conv.updatedAt = Date.now();
                    await persist(conv);
                }
                lastError = streamErr.message;
            } else {
                console.warn('流式输出失败，回退到非流式:', streamErr);
                try {
                    const reply = await callChat(buildApiMessages(conv), thinkingOptions(), 3);
                    conv.messages.push({
                        id: uid(),
                        role: 'assistant',
                        content: reply.content || '',
                        reasoning: reply.reasoning_content || '',
                        usage: reply.usage || null,
                        ts: Date.now()
                    });
                    conv.updatedAt = Date.now();
                    await persist(conv);
                } catch (e) {
                    lastError = (e && e.message) ? e.message : '网络异常';
                }
            }
        } finally {
            bubble.remove();
            sending = false;
            updateSendState();
            sortConversations();
            renderConvList();
            renderMessages();
            renderHeader();
        }

        if (!lastError) generateTitle(conv);       // 首轮结束后自动起标题，不阻塞输入
        if (!lastError) compressIfNeeded(conv);   // 后台压缩，不阻塞输入
    }

    // ================================================================
    //  上下文压缩（每 COMPRESS_EVERY 轮用户消息一次）
    // ================================================================
    async function compressIfNeeded(conv) {
        if (turnsSinceCompress(conv) < COMPRESS_EVERY) return;

        const end = conv.messages.length - KEEP_RECENT;
        if (end <= conv.compressIndex) return;

        const chunk = conv.messages.slice(conv.compressIndex, end);
        const transcript = chunk.map(m => {
            const who = m.role === 'user' ? '用户' : (m.role === 'assistant' ? '助手' : '系统');
            const imgs = (m.images && m.images.length) ? '（含图片）' : '';
            return who + '：' + (m.content || '').slice(0, 800) + imgs;
        }).join('\n');

        const prev = conv.summary ? '【已有摘要】\n' + conv.summary + '\n\n' : '';
        const prompt = prev +
            '请把以下对话压缩成简洁的中文要点摘要，保留关键事实、结论、用户偏好与未完成事项，' +
            '不要遗漏重要细节，尽量控制在 400 字以内。只输出摘要正文：\n\n' + transcript;

        el.ctxHint.textContent = '正在压缩上下文…';
        try {
            // 压缩是纯摘要任务，关闭思考以省时间与 token
            const res = await callChat([{ role: 'user', content: prompt }], { thinking: { type: 'disabled' } }, 2);
            const summary = (res && res.content ? res.content : '').trim();
            if (summary) {
                conv.summary = summary;
                conv.compressIndex = end;
                conv.compressCount += 1;
                conv.messages.push({
                    id: uid(),
                    role: 'system',
                    content: '上下文已压缩（第 ' + conv.compressCount + ' 次），更早的对话已总结为摘要',
                    ts: Date.now()
                });
                conv.updatedAt = Date.now();
                await persist(conv);
                toast('上下文已压缩，对话可以继续了');
            }
        } catch (e) {
            console.warn('上下文压缩失败，将在下次继续尝试:', e);
        }
        renderMessages();
        renderHeader();
    }

    // ================================================================
    //  持久化
    // ================================================================
    async function persist(conv) {
        try {
            await dbPut(conv);
        } catch (e) {
            console.error('保存失败:', e);
            toast('保存失败，可能是存储空间不足');
        }
    }

    // ================================================================
    //  图片处理
    // ================================================================
    function fileToDataURL(file) {
        return new Promise((resolve, reject) => {
            const r = new FileReader();
            r.onload = () => resolve(r.result);
            r.onerror = () => reject(r.error);
            r.readAsDataURL(file);
        });
    }

    // 压缩到适合传输与存储的尺寸（同时避免 iOS 透明 PNG 变黑底）
    async function compressImage(file, maxDim = 1280, quality = 0.82) {
        const dataUrl = await fileToDataURL(file);
        try {
            const img = await new Promise((resolve, reject) => {
                const i = new Image();
                i.onload = () => resolve(i);
                i.onerror = reject;
                i.src = dataUrl;
            });
            let w = img.naturalWidth, h = img.naturalHeight;
            if (!w || !h) return dataUrl;
            if (Math.max(w, h) > maxDim) {
                const s = maxDim / Math.max(w, h);
                w = Math.round(w * s);
                h = Math.round(h * s);
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            return canvas.toDataURL('image/jpeg', quality);
        } catch (e) {
            console.warn('图片压缩失败，使用原图:', e);
            return dataUrl;
        }
    }

    async function handleFiles(files) {
        const list = Array.from(files).filter(f => f.type.startsWith('image/'));
        if (!list.length) return;
        for (const f of list) {
            if (pendingImages.length >= 6) { toast('单条消息最多 6 张图片'); break; }
            try {
                pendingImages.push(await compressImage(f));
            } catch (e) {
                toast('图片读取失败：' + f.name);
            }
        }
        renderPreviews();
        el.fileInput.value = '';
    }

    function renderPreviews() {
        el.imgPreviews.innerHTML = '';
        pendingImages.forEach((src, idx) => {
            const box = document.createElement('div');
            box.className = 'thumb';
            const img = document.createElement('img');
            img.src = src;
            img.alt = '待发送图片';
            const rm = document.createElement('button');
            rm.type = 'button';
            rm.textContent = '×';
            rm.title = '移除';
            rm.addEventListener('click', () => {
                pendingImages.splice(idx, 1);
                renderPreviews();
            });
            box.appendChild(img);
            box.appendChild(rm);
            el.imgPreviews.appendChild(box);
        });
    }

    // ================================================================
    //  输入框
    // ================================================================
    function autoGrow() {
        el.input.style.height = 'auto';
        el.input.style.height = Math.min(el.input.scrollHeight, 168) + 'px';
    }

    function updateSendState() {
        el.sendBtn.disabled = sending;
        el.sendBtn.textContent = sending ? '生成中…' : '发送';
    }

    // ================================================================
    //  主题
    // ================================================================
    function applyTheme(dark) {
        document.body.classList.toggle('dark-mode', dark);
        const icon = dark ? '☀️' : '🌙';
        el.mobileTheme.textContent = icon;
        el.desktopTheme.textContent = icon + (dark ? ' 浅色模式' : ' 深色模式');
    }

    function initTheme() {
        applyTheme(localStorage.getItem('darkMode') === 'true');
        const toggle = () => {
            const dark = !document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', dark);
            applyTheme(dark);
        };
        el.mobileTheme.addEventListener('click', toggle);
        el.desktopTheme.addEventListener('click', toggle);
    }

    // ================================================================
    //  思考强度
    // ================================================================
    function updateEffortUI() {
        const level = EFFORT_LEVELS[effortIndex];
        el.effortName.textContent = level.name;
        el.effortBtn.textContent = '强度：' + level.name;
        el.effortRange.value = String(effortIndex);
    }

    function setEffortIndex(idx) {
        const max = EFFORT_LEVELS.length - 1;
        effortIndex = Math.min(max, Math.max(0, Number(idx) || 0));
        localStorage.setItem('ai_effort', String(effortIndex));
        updateEffortUI();
    }

    // 只有开启深度思考时才显示强度按钮；关闭时顺带收起下拉框
    function syncThinkUI() {
        el.effortBtn.classList.toggle('show', el.thinkToggle.checked);
        if (!el.thinkToggle.checked) el.effortPop.classList.remove('show');
    }

    // ================================================================
    //  调试模式（绕过站点代理，用自填密钥直连）
    // ================================================================
    const DBG_SETTINGS_KEY = 'ai_debug';     // sessionStorage：面板设置
    const DBG_ON_KEY = 'ai_debugOn';         // sessionStorage：调试模式开关

    function loadDebug() {
        let saved = null;
        try {
            saved = JSON.parse(sessionStorage.getItem(DBG_SETTINGS_KEY) || 'null');
        } catch (e) {
            saved = null;
        }
        if (saved) {
            debug.endpoint = saved.endpoint || DEBUG_DEFAULTS.endpoint;
            debug.model = saved.model || DEBUG_DEFAULTS.model;
            debug.key = saved.key || '';           // 仅当用户勾选“记住”时才会存在
            el.dbgRemember.checked = !!saved.remember;
        }
        // 未记住密钥时，刷新后内存中的密钥已丢失，调试模式自动失效
        debug.enabled = sessionStorage.getItem(DBG_ON_KEY) === '1' && !!debug.key;
        applyDebugUI();
    }

    function saveDebug() {
        const endpoint = el.dbgEndpoint.value.trim();
        const key = el.dbgKey.value.trim();
        if (!endpoint) { setDbgStatus('请填写接口地址', 'err'); return; }
        if (!key) { setDbgStatus('请填写 API 密钥', 'err'); return; }

        debug.endpoint = endpoint;
        debug.key = key;
        debug.model = el.dbgModel.value.trim() || DEBUG_DEFAULTS.model;
        debug.enabled = true;

        // 密钥只在勾选时写入 sessionStorage，且随标签页关闭自动清除
        const data = {
            endpoint: debug.endpoint,
            model: debug.model,
            remember: el.dbgRemember.checked
        };
        if (el.dbgRemember.checked) data.key = debug.key;
        try {
            sessionStorage.setItem(DBG_SETTINGS_KEY, JSON.stringify(data));
            sessionStorage.setItem(DBG_ON_KEY, '1');
        } catch (e) {
            console.warn('调试设置保存失败:', e);
        }

        applyDebugUI();
        closeDebugPanel();
        toast('调试模式已开启：请求将直接使用你填写的密钥');
    }

    function turnOffDebug() {
        debug.enabled = false;
        sessionStorage.removeItem(DBG_ON_KEY);
        applyDebugUI();
        closeDebugPanel();
        toast('已关闭调试模式，恢复使用站点接口');
    }

    function applyDebugUI() {
        document.body.classList.toggle('debug-mode', debug.enabled);
        el.debugBadge.classList.toggle('show', debug.enabled);
        el.dbgEndpoint.value = debug.endpoint;
        el.dbgKey.value = debug.key;
        el.dbgModel.value = debug.model;
    }

    function openDebugPanel() {
        applyDebugUI();
        setDbgStatus(debug.enabled ? '当前状态：调试模式已开启' : '', debug.enabled ? 'ok' : '');
        el.dbgMask.classList.add('show');
        el.dbgKey.focus();
    }

    function closeDebugPanel() {
        el.dbgMask.classList.remove('show');
    }

    function setDbgStatus(text, cls) {
        el.dbgStatus.textContent = text || '';
        el.dbgStatus.className = 'debug-status' + (cls ? ' ' + cls : '');
    }

    // 用面板中当前填写的内容发一条最小请求，验证密钥与地址是否可用
    async function testDebugConnection() {
        const endpoint = el.dbgEndpoint.value.trim();
        const key = el.dbgKey.value.trim();
        const model = el.dbgModel.value.trim() || DEBUG_DEFAULTS.model;
        if (!endpoint || !key) { setDbgStatus('请先填写接口地址和 API 密钥', 'err'); return; }

        setDbgStatus('测试中…', '');
        el.dbgTest.disabled = true;
        try {
            const resp = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
                body: JSON.stringify({
                    model: model,
                    messages: [{ role: 'user', content: 'hi' }],
                    max_tokens: 5,
                    stream: false
                })
            });
            if (!resp.ok) {
                const t = await resp.text();
                throw new Error('HTTP ' + resp.status + (t ? '：' + t.slice(0, 200) : ''));
            }
            const data = await resp.json();
            const msg = data && data.choices && data.choices[0] && data.choices[0].message;
            setDbgStatus('✅ 连接成功，模型返回：' + (((msg && msg.content) || '(空)').slice(0, 60)), 'ok');
        } catch (e) {
            setDbgStatus('❌ 失败：' + (e.message || e) + '（若提示网络/CORS 错误，说明该接口不允许浏览器直连）', 'err');
        } finally {
            el.dbgTest.disabled = false;
        }
    }

    // ================================================================
    //  事件绑定
    // ================================================================
    function bindEvents() {
        el.newChatBtn.addEventListener('click', newConversation);

        el.menuBtn.addEventListener('click', toggleSidebar);
        el.overlay.addEventListener('click', closeSidebar);

        el.sendBtn.addEventListener('click', submit);

        el.imgBtn.addEventListener('click', () => el.fileInput.click());
        el.fileInput.addEventListener('change', e => handleFiles(e.target.files));

        el.thinkToggle.addEventListener('change', () => {
            localStorage.setItem('ai_deepThinking', el.thinkToggle.checked);
            syncThinkUI();
        });

        el.effortBtn.addEventListener('click', e => {
            e.stopPropagation();
            el.effortPop.classList.toggle('show');
        });
        el.effortRange.addEventListener('input', e => setEffortIndex(e.target.value));
        // 点击别处收起强度面板
        document.addEventListener('click', e => {
            if (!el.effortPop.classList.contains('show')) return;
            if (el.effortPop.contains(e.target) || e.target === el.effortBtn) return;
            el.effortPop.classList.remove('show');
        });

        el.input.addEventListener('input', autoGrow);
        el.input.addEventListener('keydown', e => {
            if (e.key !== 'Enter') return;
            if (e.shiftKey) return;
            if (isCoarsePointer) return;   // 手机端 Enter 换行，用发送按钮提交
            e.preventDefault();
            submit();
        });

        // 图片粘贴
        el.input.addEventListener('paste', e => {
            const items = Array.from(e.clipboardData ? e.clipboardData.items : []);
            const files = items.filter(it => it.type.startsWith('image/')).map(it => it.getAsFile());
            if (files.length) {
                e.preventDefault();
                handleFiles(files);
            }
        });

        // 拖拽图片
        document.addEventListener('dragover', e => e.preventDefault());
        document.addEventListener('drop', e => {
            if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
                e.preventDefault();
                handleFiles(e.dataTransfer.files);
            }
        });

        // ---- 自动滚动的跟随判定 + 滑到最下 ----
        el.messages.addEventListener('scroll', () => {
            stickToBottom = atBottom();
            updateScrollBtn();
        });
        el.scrollBtn.addEventListener('click', () => scrollToBottom(true));

        // ---- 通用对话框 ----
        el.dlgCancel.addEventListener('click', () => closeDialog(false));
        el.dlgOk.addEventListener('click', () => closeDialog(true));
        el.dlgMask.addEventListener('click', e => {
            if (e.target === el.dlgMask) closeDialog(false);
        });
        // 回车确认 / Esc 取消；stopPropagation 免得触发全局 Esc 逻辑
        el.dlgMask.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                e.stopPropagation();
                closeDialog(true);
            } else if (e.key === 'Escape') {
                e.preventDefault();
                e.stopPropagation();
                closeDialog(false);
            }
        });

        // ---- 调试模式 ----
        el.debugBadge.addEventListener('click', openDebugPanel);
        el.dbgTest.addEventListener('click', testDebugConnection);
        el.dbgSave.addEventListener('click', saveDebug);
        el.dbgCancel.addEventListener('click', closeDebugPanel);
        el.dbgOff.addEventListener('click', turnOffDebug);
        el.dbgMask.addEventListener('click', e => {
            if (e.target === el.dbgMask) closeDebugPanel();
        });
        // 快捷键：Ctrl/Cmd + Shift + Alt + D
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.altKey && e.code === 'KeyD') {
                e.preventDefault();
                if (el.dbgMask.classList.contains('show')) closeDebugPanel();
                else openDebugPanel();
                return;
            }
            if (e.key === 'Escape') {
                if (el.lightbox.classList.contains('show')) el.lightbox.classList.remove('show');
                else if (el.dbgMask.classList.contains('show')) closeDebugPanel();
                else el.effortPop.classList.remove('show');
            }
        });
    }

    // ================================================================
    //  微信环境拦截
    // ================================================================
    const isWeChat = () => (navigator.userAgent || '').toLowerCase().indexOf('micromessenger') !== -1;

    // 微信浏览器不支持本平台，只提示用户去系统浏览器打开
    function showWeChatBlock() {
        const mask = document.createElement('div');
        mask.className = 'wx-block';
        const card = document.createElement('div');
        card.className = 'wx-card';
        card.innerHTML =
            '<div class="wx-emoji">⚠️</div>' +
            '<div class="wx-title">检测到微信环境</div>' +
            '<div class="wx-line">微信浏览器不支持使用本平台。</div>' +
            '<div class="wx-line">请点击右上角 <strong>⋯</strong> 菜单，</div>' +
            '<div class="wx-line">选择 <strong class="ok">在浏览器中打开</strong> 后，使用系统默认浏览器访问本页面。</div>' +
            '<div class="wx-foot">aiLin AI 对话平台</div>';
        mask.appendChild(card);
        document.body.appendChild(mask);
    }

    // ================================================================
    //  初始化
    // ================================================================
    async function init() {
        // 微信浏览器下不初始化任何功能，直接拦住
        if (isWeChat()) {
            showWeChatBlock();
            console.warn('🚫 检测到微信浏览器，已阻止应用启动。');
            return;
        }

        initTheme();
        bindEvents();
        loadDebug();
        el.thinkToggle.checked = localStorage.getItem('ai_deepThinking') === 'true';
        const savedEffort = parseInt(localStorage.getItem('ai_effort'), 10);
        effortIndex = Number.isInteger(savedEffort)
            ? Math.min(EFFORT_LEVELS.length - 1, Math.max(0, savedEffort))
            : DEFAULT_EFFORT_INDEX;
        updateEffortUI();
        syncThinkUI();
        autoGrow();
        updateSendState();
        renderPreviews();

        try {
            await openDB();
            conversations = await dbGetAll();
            sortConversations();
        } catch (e) {
            console.error('数据库打开失败:', e);
            toast('本地存储不可用，对话将无法保存');
        }

        // 旧对话的 id 不是 16 位 base64url，统一迁到新格式（先写新记录，成功后再删旧记录）
        const idMap = new Map();
        for (const c of conversations) {
            if (isChatId(c.id)) continue;
            const oldId = c.id;
            c.id = newChatId();
            try {
                await dbPut(c);
                await dbDelete(oldId);
                idMap.set(oldId, c.id);
            } catch (e) {
                c.id = oldId;   // 迁移失败就回退，旧记录还在
                console.warn('对话 id 迁移失败:', e);
            }
        }

        // ?chat=<id> 优先于上次打开的对话
        const linkId = new URLSearchParams(location.search).get('chat');
        const remap = id => (id ? (idMap.get(id) || id) : null);
        const usable = id => !!id && conversations.some(c => c.id === id);
        const wanted = remap(linkId);
        const fallback = remap(localStorage.getItem('ai_currentConv')) ||
            (conversations[0] ? conversations[0].id : null);

        if (usable(wanted)) {
            currentId = wanted;
        } else {
            if (linkId) toast('未找到该对话，可能不在这台设备上');
            currentId = usable(fallback) ? fallback : null;
        }
        if (currentId) localStorage.setItem('ai_currentConv', currentId);
        syncChatUrl();

        applySidebarCollapsed();
        renderConvList();
        renderMessagesWithLoading();
        renderHeader();

        // marked / DOMPurify 是 defer 脚本，等页面资源全部就绪后再渲染一次，
        // 保证历史消息也用完整 Markdown 渲染（CDN 不可用时自动降级）
        window.addEventListener('load', () => { if (!sending) renderMessages(); });
    }

    init();
})();
</script>
